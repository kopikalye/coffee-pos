<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee POS</title>
    <script>
        // Function to format numbers
        function formatNumber(num) {
            return num.toLocaleString();
        }

        // Simulated database integration
        const salesData = [
            { date: '2026-03-29', sales: 150, transactions: 25 },
            { date: '2026-03-30', sales: 200, transactions: 30 }
        ];

        function displayStats() {
            let totalSales = 0;
            let totalTransactions = 0;

            salesData.forEach(record => {
                totalSales += record.sales;
                totalTransactions += record.transactions;
            });

            document.getElementById('total-sales').innerText = 'Total Sales: $' + formatNumber(totalSales);
            document.getElementById('transaction-count').innerText = 'Total Transactions: ' + formatNumber(totalTransactions);
        }

        window.onload = displayStats;
    </script>
</head>
<body>
    <h1>Welcome to Coffee POS</h1>
    <div id="stats">
        <p id="total-sales"></p>
        <p id="transaction-count"></p>
    </div>
</body>
</html>
