<!DOCTYPE html>
<html>
<head>
  <title>Coffee Shop POS</title>
</head>
<body>

<h2>☕ Coffee Shop POS</h2>

<!-- INPUT -->
<input type="text" id="itemName" placeholder="Item name">
<input type="number" id="itemPrice" placeholder="Price">
<button onclick="addToCart()">Add to Cart</button>

<h3>🛒 Cart</h3>
<ul id="cartList"></ul>

<h3>Total: ₱<span id="total">0</span></h3>

<input type="number" id="payment" placeholder="Payment">
<button onclick="calculateChange()">Calculate Change</button>

<h3>Change: ₱<span id="change">0</span></h3>

<button onclick="saveSale()">💾 Save Daily Sale</button>

<hr>

<h2>📊 Daily Sales</h2>
<ul id="salesList"></ul>

<script>
let cart = [];
let total = 0;

// LOAD SALES FROM STORAGE
let sales = JSON.parse(localStorage.getItem("sales")) || [];

// ADD TO CART
function addToCart() {
  const name = document.getElementById("itemName").value;
  const price = parseFloat(document.getElementById("itemPrice").value);

  if (!name || !price) return;

  cart.push({ name, price });
  total += price;

  renderCart();
}

// DISPLAY CART
function renderCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach((item, i) => {
    list.innerHTML += `
      <li>
        ${item.name} - ₱${item.price}
        <button onclick="removeItem(${i})">Delete</button>
      </li>
    `;
  });

  document.getElementById("total").innerText = total;
}

// REMOVE ITEM
function removeItem(i) {
  total -= cart[i].price;
  cart.splice(i, 1);
  renderCart();
}

// CALCULATE CHANGE
function calculateChange() {
  let payment = parseFloat(document.getElementById("payment").value);
  let change = payment - total;
  document.getElementById("change").innerText = change;
}

// SAVE SALE
function saveSale() {
  if (cart.length === 0) return;

  let sale = {
    items: cart,
    total: total,
    date: new Date().toLocaleString()
  };

  sales.push(sale);
  localStorage.setItem("sales", JSON.stringify(sales));

  alert("Sale saved!");

  cart = [];
  total = 0;

  renderCart();
  renderSales();
}

// LOAD SALES
function renderSales() {
  let list = document.getElementById("salesList");
  list.innerHTML = "";

  sales.forEach((sale, i) => {
    list.innerHTML += `
      <li>
        ₱${sale.total} - ${sale.date}
        <button onclick="deleteSale(${i})">Delete</button>
      </li>
    `;
  });
}

// DELETE SALE
function deleteSale(i) {
  sales.splice(i, 1);
  localStorage.setItem("sales", JSON.stringify(sales));
  renderSales();
}

// INITIAL LOAD
renderSales();
</script>

</body>
</html>
