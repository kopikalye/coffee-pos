<!DOCTYPE html>
<html>
<head>
  <title>Coffee POS</title>
</head>
<body>

<h2>☕ Coffee Shop POS</h2>

<input id="itemName" placeholder="Item name">
<input id="itemPrice" type="number" placeholder="Price">
<button onclick="addToCart()">Add</button>

<h3>Cart</h3>
<ul id="cartList"></ul>

<h3>Total: ₱<span id="total">0</span></h3>

<input id="payment" type="number" placeholder="Payment">
<button onclick="calculateChange()">Change</button>

<h3>Change: ₱<span id="change">0</span></h3>

<button onclick="saveSale()">💾 Save Sale</button>

<hr>

<h2>📊 Sales</h2>
<ul id="salesList"></ul>

<script>
let cart = [];
let total = 0;

let sales = JSON.parse(localStorage.getItem("sales")) || {};

function addToCart() {
  let name = document.getElementById("itemName").value;
  let price = parseFloat(document.getElementById("itemPrice").value);

  if (!name || !price) return;

  cart.push({ name, price });
  total += price;

  renderCart();
}

function renderCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach((item, i) => {
    list.innerHTML += `<li>${item.name} - ₱${item.price}</li>`;
  });

  document.getElementById("total").innerText = total;
}

function calculateChange() {
  let payment = parseFloat(document.getElementById("payment").value);
  let change = payment - total;
  document.getElementById("change").innerText = change;
}

function saveSale() {
  let date = new Date().toLocaleDateString();

  if (!sales[date]) sales[date] = [];

  sales[date].push({
    items: [...cart], // copy items
    total: total,
    time: new Date().toLocaleTimeString()
  });

  localStorage.setItem("sales", JSON.stringify(sales));

  cart = [];
  total = 0;

  renderCart();
  renderSales();
}

// DELETE FUNCTION
function deleteSale(date, index) {
  sales[date].splice(index, 1);

  if (sales[date].length === 0) {
    delete sales[date];
  }

  localStorage.setItem("sales", JSON.stringify(sales));
  renderSales();
}

function renderSales() {
  let list = document.getElementById("salesList");
  list.innerHTML = "";

  Object.keys(sales).forEach(date => {
    let dailyTotal = 0;
    let itemsHTML = "";

    sales[date].forEach((sale, i) => {
      dailyTotal += sale.total;

      // ✅ SHOW ITEM NAMES
      let itemList = "";
      sale.items.forEach(item => {
        itemList += `<li>${item.name} - ₱${item.price}</li>`;
      });

      itemsHTML += `
        <li style="margin-bottom:10px;">
          <b>₱${sale.total}</b> - ${sale.time}

          <ul style="margin-top:5px;">
            ${itemList}
          </ul>

          <button onclick="deleteSale('${date}', ${i})" style="margin-top:5px;">
            ❌ Delete
          </button>
        </li>
      `;
    });

    list.innerHTML += `
      <div style="margin-bottom:10px; border:1px solid #ccc; padding:10px;">
        
        <h3 onclick="toggle('${date}')" style="cursor:pointer;">
          📅 ${date} ▼
        </h3>

        <div id="content-${date}" style="display:none;">
          <ul>
            ${itemsHTML}
          </ul>

          <b>Total: ₱${dailyTotal}</b>
        </div>

      </div>
    `;
  });
}

function toggle(date) {
  let content = document.getElementById("content-" + date);

  content.style.display =
    content.style.display === "none" ? "block" : "none";
}

// Load on start
renderSales();
</script>

</body>
</html>
