<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Coffee POS</title>

<style>
  body { font-family: Arial; margin:0; background:#f4f4f4; }
  header { background:#6f4e37; color:white; text-align:center; padding:15px; }

  .container { display:flex; gap:20px; padding:20px; flex-wrap:wrap; }

  .box {
    background:white;
    padding:15px;
    border-radius:10px;
    width:48%;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }

  input {
    width:100%;
    padding:8px;
    margin:5px 0;
  }

  button {
    width:100%;
    padding:8px;
    border:none;
    background:#6f4e37;
    color:white;
    cursor:pointer;
    border-radius:5px;
  }

  button:hover { background:#4e342e; }

  .item, .cart-item {
    display:flex;
    justify-content:space-between;
    margin:5px 0;
  }

  .total, .change {
    font-weight:bold;
    margin-top:10px;
  }

  .sales-day {
    margin-bottom:15px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
  }
</style>
</head>

<body>

<header>
  <h1>☕ Coffee Shop POS (Pro)</h1>
</header>

<div class="container">

  <!-- MENU -->
  <div class="box">
    <h2>Menu</h2>

    <input id="itemName" placeholder="Item Name">
    <input id="itemPrice" type="number" placeholder="Price">
    <button onclick="addMenuItem()">Add Item</button>

    <hr>
    <div id="menu"></div>
  </div>

  <!-- CART -->
  <div class="box">
    <h2>Cart</h2>
    <div id="cart"></div>

    <div class="total">Total: ₱<span id="total">0</span></div>

    <input id="cash" type="number" placeholder="Enter Cash">
    <button onclick="calculateChange()">Calculate Change</button>

    <div class="change">Change: ₱<span id="change">0</span></div>

    <button onclick="checkout()">Checkout</button>
  </div>

  <!-- SALES -->
  <div class="box" style="width:100%;">
    <h2>📊 Daily Sales</h2>
    <button onclick="renderSales()">Refresh</button>
    <div id="sales"></div>
  </div>

</div>

<script>

let menu = JSON.parse(localStorage.getItem("menu")) || [
  { name: "Espresso", price: 80 },
  { name: "Latte", price: 120 }
];

let cart = [];

function saveMenu() {
  localStorage.setItem("menu", JSON.stringify(menu));
}

function addMenuItem() {
  let name = document.getElementById("itemName").value;
  let price = parseFloat(document.getElementById("itemPrice").value);

  if (!name || !price) return alert("Fill all fields");

  menu.push({ name, price });
  saveMenu();
  renderMenu();
}

function renderMenu() {
  let div = document.getElementById("menu");
  div.innerHTML = "";

  menu.forEach((item, i) => {
    div.innerHTML += `
      <div class="item">
        <span>${item.name} - ₱${item.price}</span>
        <button onclick="addToCart(${i})">Add</button>
      </div>
    `;
  });
}

function addToCart(i) {
  cart.push(menu[i]);
  renderCart();
}

function renderCart() {
  let div = document.getElementById("cart");
  div.innerHTML = "";

  let total = 0;

  cart.forEach(item => {
    total += item.price;

    div.innerHTML += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>₱${item.price}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}

function calculateChange() {
  let total = cart.reduce((s, i) => s + i.price, 0);
  let cash = parseFloat(document.getElementById("cash").value);

  if (isNaN(cash) || cash < total) {
    alert("Insufficient cash!");
    return;
  }

  document.getElementById("change").innerText = cash - total;
}

function checkout() {
  if (cart.length === 0) return alert("Cart is empty");

  let total = cart.reduce((s, i) => s + i.price, 0);
  let cash = parseFloat(document.getElementById("cash").value);

  if (cash < total) return alert("Not enough cash");

  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.push({
    date: new Date().toISOString(),
    total: total,
    cash: cash,
    change: cash - total
  });

  localStorage.setItem("sales", JSON.stringify(sales));

  alert("Order Complete!");

  cart = [];
  renderCart();
  renderSales();
}

function renderSales() {
  let sales = JSON.parse(localStorage.getItem("sales")) || [];
  let div = document.getElementById("sales");

  if (sales.length === 0) {
    div.innerHTML = "<p>No sales yet</p>";
    return;
  }

  let grouped = {};

  sales.forEach(s => {
    let date = new Date(s.date).toLocaleDateString();

    if (!grouped[date]) grouped[date] = [];

    grouped[date].push(s);
  });

  let grandTotal = 0;

  for (let date in grouped) {
